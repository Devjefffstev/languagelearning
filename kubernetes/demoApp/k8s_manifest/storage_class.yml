apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  # name: auto-ebs-sc
  name: ebs-sc
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
# provisioner: ebs.csi.eks.amazonaws.com
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
# volumeBindingMode: Immediate
parameters:
  type: gp3
  encrypted: "true"
  ## failed to provision volume with StorageClass "auto-ebs-sc": error generating accessibility requirements: no topology key found on CSINode ip-10-0-1-114.ec2.internal
# allowedTopologies:
# - matchLabelExpressions:
#   - key: topology.ebs.csi.aws.com/zone
#     values:
#     - us-east-1a
#     - us-east-1b
#     - us-east-1c

--- 
# creating a pvc for testing 
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc  
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  # storageClassName: auto-ebs-sc
  volumeMode: Filesystem

---
# creating a pod to test the pvc  
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: test-container
    image: nginx
    volumeMounts:
    - mountPath: /usr/share/nginx/html
      name: test-volume
  volumes:
  - name: test-volume
    persistentVolumeClaim:
      claimName: test-pvc
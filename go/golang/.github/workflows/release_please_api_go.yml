name: API_Go_ReleasePleaseWorkflow

on:
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Log level (trace, debug, info, warn, error, fatal, panic)'
        required: false
        default: 'info'
        type: string
  push:
    branches:
      - main
    paths:
      - reusable-api-go/**
  pull_request:
    branches:
      - main
    paths:
      - reusable-api-go/**

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write


env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  PATH_PREFIX: reusable-api-go/
  BRANCH_PREFIX: main

jobs:
  find-release-changes:
    name: Change finder for API Go folders
    runs-on: ubuntu-latest
    outputs:
      api-paths: ${{ steps.change-finder.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install @octokit/action
        name: Install Octokit
      - id: change-finder
        uses: actions/github-script@v6.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { Octokit } = require("@octokit/action");
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const octokit = new Octokit()
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const branchPrefix = process.env.BRANCH_PREFIX;

            let latestRelease;
            try {
              latestRelease = await octokit.request('GET /repos/{owner}/{repo}/releases/latest', {
                owner: owner,
                repo: repo,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              })
              console.log(`latest release: ${JSON.stringify(latestRelease.data)}`);
            } catch (error) {
              if (error.status === 404) {
                console.log('No releases found. This is the first release. Scanning all API folders.');
                // Return all folders in reusable-api-go directory
                const apiBasePath = process.env.PATH_PREFIX.replace(/\/$/, '');
                const apiDirs = fs.readdirSync(apiBasePath, { withFileTypes: true })
                  .filter(dirent => dirent.isDirectory())
                  .map(dirent => dirent.name);
                console.log("API paths (all folders):");
                console.log(apiDirs);
                return apiDirs;
              }
              throw error;
            }

            execSync('git pull --tags');
            const status = execSync(`git diff --name-only ${latestRelease.data.tag_name} origin/${branchPrefix}`, { encoding: 'utf-8'});
            console.log("Status of changes since last release:");
            console.log(status);
            const changes = status.split('\n');
            let api_paths = new Set();
            for (const change of changes) {
              if (change.startsWith(process.env.PATH_PREFIX)) {
                  const pathParts = change.split('/');
                  if (pathParts.length >= 2) {
                      const apiFolder = pathParts[1];
                      api_paths.add(apiFolder);
                  }
              };
            }
            api_paths = Array.from(api_paths);
            console.log("API paths with changes:");
            console.log(api_paths);
            return api_paths;


  validate-output:
    runs-on: ubuntu-latest
    needs: find-release-changes
    steps:
      - run: echo ${{toJson(needs.find-release-changes.outputs.api-paths)}}

  build-and-release:
    name: build-and-release-api
    uses: Devjefffstev/reusableWorkflows/.github/workflows/rwf_release_please_go.yml@main
    needs: find-release-changes
    if: needs.find-release-changes.outputs.api-paths != '[]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        api: ${{fromJson(needs.find-release-changes.outputs.api-paths)}}
    with:
      release-type: go
      repo-url: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      skip-github-release: false
      skip-github-pull-request: false
      path: reusable-api-go/${{ matrix.api }}
      package-name: ${{ matrix.api }}
      run-tests: true
      build-binary: true
    secrets:
      secret_github_token: ${{ secrets.GH_TOKEN }}
